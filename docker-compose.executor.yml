# Runs the orchestrator executor on kenta-server. Reached on the home docker network by the kgpt
# module; publishes no ports. See docs/executor-host.md for the full setup runbook.
services:
  orchestrator-executor:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: orchestrator-executor
    env_file: ./executor.env
    volumes:
      - ./work:/work
      - ${ORCH_CREDS}/claude-a:/home/orch/.claude-a
      - ${ORCH_CREDS}/claude-b:/home/orch/.claude-b
      - ${ORCH_CREDS}/codex:/home/orch/.codex
      - ${ORCH_CREDS}/gh:/home/orch/.config/gh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
