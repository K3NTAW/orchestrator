# Runs the orchestrator executor on kenta-server. Joins the existing home docker network named by
# ORCH_NET (the kgpt module's docker compose project's default network) so the kgpt module can reach it
# there; publishes no ports. See docs/executor-host.md for the full setup runbook.
#
# The gitconfig mount is read-only: `gh auth setup-git` writes it (the credential helper entries gh
# needs for `git push`/`git clone` over https), but no agent running inside the container should be able
# to rewrite git's credential configuration at runtime. docs/executor-host.md documents the one-off,
# non-compose step that produces the host file before it's mounted here.
services:
  orchestrator-executor:
    build:
      context: .
      args:
        UID: ${ORCH_UID:-1000}
        GID: ${ORCH_GID:-1000}
    image: orchestrator-executor
    env_file:
      - path: ./executor.env
        required: true
    volumes:
      - ./work:/work
      - ./config/repos.toml:/opt/orchestrator/.orchestrator/repos.toml:ro
      - ./config/pool.toml:/opt/orchestrator/.orchestrator/pool.toml:ro
      - ${ORCH_CREDS:?set ORCH_CREDS to the credential root, e.g. ~/orch-creds}/claude-a:/home/orch/.claude-a
      - ${ORCH_CREDS:?set ORCH_CREDS to the credential root, e.g. ~/orch-creds}/claude-b:/home/orch/.claude-b
      - ${ORCH_CREDS:?set ORCH_CREDS to the credential root, e.g. ~/orch-creds}/codex:/home/orch/.codex
      - ${ORCH_CREDS:?set ORCH_CREDS to the credential root, e.g. ~/orch-creds}/gh:/home/orch/.config/gh
      - ${ORCH_CREDS:?set ORCH_CREDS to the credential root, e.g. ~/orch-creds}/gitconfig:/home/orch/.gitconfig:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 6g
    pids_limit: 512

networks:
  default:
    external: true
    name: "${ORCH_NET:?set ORCH_NET to the docker network the kgpt module runs on}"
