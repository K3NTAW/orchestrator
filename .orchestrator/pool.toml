[models]
# A locally measured per-class success rate must meet this floor before cost routing may select it;
# the rate requires min_samples tasks of that class.
success_floor = 0.6
# Cold classes keep the weighted benchmark/live-score routing until this many merged tasks exist.
min_samples = 3
haiku   = "claude-haiku-4-5-20251001"
sonnet  = "claude-sonnet-5"
opus    = "claude-opus-5"
planner = "claude-fable-5-1"

[limits]
# Default true; budget reservations prevent same-tick launches from oversubscribing daily/goal limits. Set false
# for rollback. Estimates use median tokens and USD from the role's last 20 runs once 5 exist; until then the
# per-run max_budget_usd ceiling is used. default_tokens_per_usd is a conservative Sonnet-class estimate until
# history exists. Optional goal_budget_usd role entries impose cumulative goal caps.
reservations = true
default_tokens_per_usd = 250000  # Default 250000; converts the cold-start USD ceiling to reserved tokens.
max_parallel_claude_workers = 4
cooldown_default_s = 1800
# scout turns/budget/timeout cut 2026-09-18: 8 sonnet scouts cost $4.59 (~720k cache-read tokens each over 20
# turns), several re-derived what memory or a grep would have answered. Recall-first prompt + tighter caps.
max_turns = { triage = 5, scout = 12, review = 10, challenge = 15, execute = 40, planner = 400 }        # soft: stated in prompts
max_budget_usd = { triage = 0.5, scout = 1.0, review = 3.0, challenge = 1.5, execute = 6.0, planner = 10.0, planner_decision = 3.0 } # hard: --max-budget-usd
timeout_s = { triage = 300, scout = 600, review = 900, challenge = 900, execute = 1800, planner = 7200 }
review_diff_chars = 12000
spec_review_code_chars = 8000
recall_hits = 30

# Jev (TypeSafe AI): typed questions about a state answered with calibrated probabilities instead of text
# (orchestrator/jev.py). Off by default -- flip enabled = true only once daily_budget_tokens has been sized
# against real usage, same caution as bench.py's MIN_INTERVAL_S. See README's Pipeline section for the note on
# what leaves the machine.
[jev]
# Repeat each question in one request and average probabilities (default: 1).
votes = 1
# Block thresholds with confidence >= 0.6 (defaults: 0.85 / 0.15).
block_redundant_p = 0.85
block_needed_p = 0.15
# Stricter block thresholds when confidence is absent (defaults: 0.92 / 0.08).
block_redundant_p_noconf = 0.92
block_needed_p_noconf = 0.08
enabled = true  # 2026-09-19 user decision: key in the Keychain, Phase E (T-0201)
model = "jev-latest"
timeout_s = 5
daily_budget_tokens = 20_000_000
max_state_chars = 100_000
gate_mode = "sample"  # E3 gate: "sample" scores a deterministic 10% sample; "log" all; "block" may deny
sample_rate = 0.1  # Fraction of calls scored in sample mode; keep labels gathered before enabling block
block_repeats = false  # In block mode, deny unchanged repeated reads only after labelling confirms the rule

# Secrets: env var name -> shell command that prints the value (Keychain-backed), e.g. the laptop's `f tok get`
# wrapper below. On a headless host with no Keychain, use the form ENV_NAME = "env:OTHER_NAME" instead, which
# reads OTHER_NAME straight from this process's environment (e.g. set by systemd/CI, not by a shell command).
# Never store values here.
[secrets.scout]
GH_READ_TOKEN = "source ~/.config/f/f.sh && f tok get gh-read --reveal"
# Headless equivalent: GH_READ_TOKEN = "env:GH_READ_TOKEN"
[secrets.review]
GH_READ_TOKEN = "source ~/.config/f/f.sh && f tok get gh-read --reveal"
[secrets.triage]
[secrets.planner]
GH_WRITE_TOKEN = "env:GH_WRITE_TOKEN"
[secrets.jev]
TYPESAFE_API_KEY = "source ~/.config/f/f.sh && f tok get typesafe --reveal"
# Headless equivalent: TYPESAFE_API_KEY = "env:TYPESAFE_API_KEY"
