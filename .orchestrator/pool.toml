# ponytail: TOML instead of YAML so stdlib tomllib parses it, no pyyaml dependency.
# window_cap_tokens is a calibration knob: set from observed 5h-window resets (§13).
window_cap_tokens = 2_000_000

[[claude_accounts]]
id = "A"
config_dir = "~/.claude-a"
role_affinity = ["planner", "scout", "triage"]
reserve_for_planner = 0.35
daily_budget_tokens = 6_000_000

[[claude_accounts]]
id = "B"
config_dir = "~/.claude-b"
role_affinity = ["scout", "triage", "review", "challenge"]
reserve_for_planner = 0.0
daily_budget_tokens = 8_000_000

[codex]
home = "~/.codex"
model = "gpt-6-astra"            # confirmed 2026-09-16, Codex CLI 0.154.0
max_parallel = 2
daily_budget_tasks = 40
pace_reserve = 0.20
on_exhausted = "hold"            # hold | fallback_claude | overflow_api

[models]
haiku  = "claude-haiku-4-5-20251001"
sonnet = "claude-sonnet-5"
opus   = "claude-opus-5"

[limits]
max_parallel_claude_workers = 4
cooldown_default_s = 1800
max_turns = { triage = 5, scout = 20, review = 10, challenge = 15 }        # soft: stated in prompts
max_budget_usd = { triage = 0.5, scout = 2.0, review = 1.5, challenge = 1.5 } # hard: --max-budget-usd
timeout_s = { triage = 300, scout = 900, review = 900, challenge = 900 }

# Secrets: env var name -> shell command that prints the value (Keychain-backed). Never store values here.
[secrets.scout]
GH_READ_TOKEN = "f tok gh-read"
[secrets.review]
GH_READ_TOKEN = "f tok gh-read"
[secrets.triage]
