[models]
haiku  = "claude-haiku-4-5-20251001"
sonnet = "claude-sonnet-5"
opus   = "claude-opus-5"

[limits]
max_parallel_claude_workers = 4
cooldown_default_s = 1800
max_turns = { triage = 5, scout = 20, review = 10, challenge = 15, execute = 40 }        # soft: stated in prompts
max_budget_usd = { triage = 0.5, scout = 2.0, review = 1.5, challenge = 1.5, execute = 6.0 } # hard: --max-budget-usd
timeout_s = { triage = 300, scout = 900, review = 900, challenge = 900, execute = 1800 }

# Secrets: env var name -> shell command that prints the value (Keychain-backed). Never store values here.
[secrets.scout]
GH_READ_TOKEN = "source ~/.config/f/f.sh && f tok get gh-read --reveal"
[secrets.review]
GH_READ_TOKEN = "source ~/.config/f/f.sh && f tok get gh-read --reveal"
[secrets.triage]
