[models]
# Keep success ranking as the default; cost_to_accepted is the measured alternative and P4 evidence decides a switch.
rank_by = "success"
# A locally measured per-class success rate must meet this floor before cost routing may select it;
# the rate requires min_samples tasks of that class.
success_floor = 0.6
# Cold classes keep the weighted benchmark/live-score routing until this many merged tasks exist.
min_samples = 3
haiku   = "claude-haiku-4-5-20251001"
sonnet  = "claude-sonnet-5"
opus    = "claude-opus-5"
planner = "claude-fable-5-1"

[limits]
# Default true; budget reservations prevent same-tick launches from oversubscribing daily/goal limits. Set false
# for rollback. Estimates use median tokens and USD from the role's last 20 runs once 5 exist; until then the
# per-run max_budget_usd ceiling is used. default_tokens_per_usd is a conservative Sonnet-class estimate until
# history exists. Optional goal_budget_usd role entries impose cumulative goal caps.
reservations = true
default_tokens_per_usd = 250000  # Default 250000; converts the cold-start USD ceiling to reserved tokens.
max_parallel_claude_workers = 4
cooldown_default_s = 1800
# scout turns/budget/timeout cut 2026-09-18: 8 sonnet scouts cost $4.59 (~720k cache-read tokens each over 20
# turns), several re-derived what memory or a grep would have answered. Recall-first prompt + tighter caps.
max_turns = { triage = 5, scout = 12, review = 10, challenge = 15, execute = 40, planner = 400 }        # soft: stated in prompts
max_budget_usd = { triage = 0.5, scout = 1.0, review = 3.0, challenge = 1.5, execute = 6.0, planner = 10.0, planner_decision = 3.0, planner_shadow = 1.5 } # hard: --max-budget-usd
timeout_s = { triage = 300, scout = 600, review = 900, challenge = 900, execute = 1800, planner = 7200 }
review_diff_chars = 12000
spec_review_code_chars = 8000
recall_hits = 30

[memory]
# Progressive recall stops after enough useful hits or the character cap; packets only use the two cheapest layers.
budget_hits = 8
min_score = 0.5
budget_chars = 6000
packet_layers = ["notes", "bus"]

# HOT view settings added 2026-09-23; tokens use the deterministic chars/4 estimate.
hot_budget_tokens = 3000
hot_never_compact = ["gotcha:open", "architecture", "decision:constraint", "decision:security"]
hot_recent_days = 14

# Jev (TypeSafe AI): typed questions about a state answered with calibrated probabilities instead of text
# (orchestrator/jev.py). Off by default -- flip enabled = true only once daily_budget_tokens has been sized
# against real usage, same caution as bench.py's MIN_INTERVAL_S. See README's Pipeline section for the note on
# what leaves the machine.
[jev]
# P19/P20, 2026-09-22: outbound Jev data-class ceiling; unknown classes fail closed.
max_data_class = "INTERNAL"
# Repeat each question in one request and average probabilities (default: 1).
votes = 1
# Block thresholds with confidence >= 0.6 (defaults: 0.85 / 0.15).
block_redundant_p = 0.85
block_needed_p = 0.15
# Stricter block thresholds when confidence is absent (defaults: 0.92 / 0.08).
block_redundant_p_noconf = 0.92
block_needed_p_noconf = 0.08
enabled = true  # 2026-09-19 user decision: key in the Keychain, Phase E (T-0201)
model = "jev-latest"
timeout_s = 5
daily_budget_tokens = 20_000_000
max_state_chars = 100_000
gate_mode = "sample"  # E3 gate: "sample" scores a deterministic 10% sample; "log" all; "block" may deny
sample_rate = 0.1  # Fraction of calls scored in sample mode; keep labels gathered before enabling block
block_repeats = false  # In block mode, deny unchanged repeated reads only after labelling confirms the rule
read_suppression = "shadow"  # "active" deterministically denies safe exact repeats after evidence checks
max_suppressions_per_session = 20
max_false_suppression = 0.02

[jev.routing]
# Questions: localized_simple, substantial_reasoning, large_context, debugging_reproduction, architectural,
# elevated_risk, stronger_executor_helps. Hard pool constraints stay authoritative; shadow never changes routing.
mode = "shadow"
cache_ttl_s = 86400
cache_max_entries = 500
# Default 0.25; caps each evidence-backed routing score adjustment.
max_adjustment = 0.25
# Default 10; minimum evidence count before a routing adjustment applies.
evidence_floor_n = 10

[jev.points]
# Default shadow; log scout-necessity Jev decisions without changing dispatch.
scout_necessity = "shadow"
# Default shadow; log context-escalation Jev decisions without changing dispatch.
context_escalation = "shadow"
# Default shadow; log review-escalation Jev decisions without changing dispatch.
review_escalation = "shadow"
# Default shadow; log planner-relaunch Jev decisions without changing dispatch.
planner_relaunch = "shadow"

[allocation]
# Default shadow; record allocation recommendations without applying them.
mode = "shadow"
# Default 5; samples required before allocation evidence is used.
min_samples = 5
# Default 2.0; hourly latency cost used in allocation comparisons.
latency_weight_usd_per_hour = 2.0
# Default 1.0; allocation multiplier for critical-path work.
critical_factor = 1.0
# Default 0.25; allocation multiplier for non-critical work.
non_critical_factor = 0.25

[strategy]
# Default shadow; record strategy recommendations without applying them.
mode = "shadow"
# Default 10; samples required before strategy evidence is used.
min_samples = 10

[speculation]
# Default off; disable speculative retries.
mode = "off"
# Default 0.5; minimum fix-round probability for speculation.
min_fix_round_p = 0.5
# Default 5; samples required before speculative retry evidence is used.
min_samples = 5
# Default 1.0 USD; minimum retry cost before speculation is considered.
min_retry_cost_usd = 1.0

[context_router]
# P23, 2026-09-22: off | shadow | active; revert by setting mode back to "off".
mode = "shadow" # shadow computes and logs the routed packet without changing what the model sees

[tool_disclosure]
# P24, 2026-09-22: off | shadow | active; revert by setting mode back to "off".
mode = "shadow"

[instructions]
# P25, 2026-09-22: conditional modules; safety rules are never conditional; revert by setting mode back to "off".
mode = "active"  # 2026-09-22 22:20 user: flipped to active (was shadow); revert: set back to "shadow"

[promotion]
# Default 20; samples required before a feature promotion recommendation.
min_samples = 20

[handoff]
# P16/T-0858: shadow measures only; active may select the lowest sufficient expected route cost.
mode = "shadow"
min_gain = 0.15
max_active_share = 0.5

# Secrets: env var name -> shell command that prints the value (Keychain-backed), e.g. the laptop's `f tok get`
# wrapper below. On a headless host with no Keychain, use the form ENV_NAME = "env:OTHER_NAME" instead, which
# reads OTHER_NAME straight from this process's environment (e.g. set by systemd/CI, not by a shell command).
# Never store values here.
[secrets.scout]
GH_READ_TOKEN = "source ~/.config/f/f.sh && f tok get gh-read --reveal"
# Headless equivalent: GH_READ_TOKEN = "env:GH_READ_TOKEN"
[secrets.review]
GH_READ_TOKEN = "source ~/.config/f/f.sh && f tok get gh-read --reveal"
[secrets.triage]
[secrets.planner]
GH_WRITE_TOKEN = "env:GH_WRITE_TOKEN"
[secrets.jev]
TYPESAFE_API_KEY = "source ~/.config/f/f.sh && f tok get typesafe --reveal"
# Headless equivalent: TYPESAFE_API_KEY = "env:TYPESAFE_API_KEY"

[scheduler]
# shadow keeps first-come dispatch and only logs proposed waves (default).
# active dispatches the selected wave; off disables wave selection and logging.
mode = "shadow"
# Default empirical; estimate execution duration from completed-task evidence.
duration_mode = "empirical"
# Default 5; samples required before an empirical duration estimate is used.
duration_min_samples = 5
# Default 0.1; fraction trimmed from each tail of large duration samples.
duration_trim = 0.1
# Default true; reserve capacity for tasks on the critical path.
reserve_imminent = true
# Default adaptive; adjust concurrency to current executor capacity.
concurrency_mode = "adaptive"
# Default observe; log merge-pressure recommendations without acting on them.
merge_pressure_mode = "observe"
# Default 3; queued merges at which merge pressure becomes elevated.
merge_queue_elevated = 3
# Default 5; queued merges at which merge pressure is saturated.
merge_queue_saturated = 5
# Default 2; merge conflicts at which merge pressure is saturated.
merge_conflicts_saturated = 2
# Default shadow; record Jev scheduler recommendations without applying them.
jev_mode = "shadow"
# Default 8; candidate task pairs considered by the Jev scheduler.
jev_max_pairs = 8
# Default 3600 seconds; Jev scheduler cache lifetime.
jev_cache_ttl_s = 3600
# Default 200; maximum retained Jev scheduler cache entries.
jev_cache_max_entries = 200
soft_conflict_policy = "defer"
max_wave = 0 # 0 uses all available dispatch capacity
# Rebase high-risk stale work before review; false records evidence only.
stale_rebase = false

[skills]
# 2026-09-23: shadow records minimal routing without changing exposure; revert: off.
mode = "shadow"
jev_mode = "shadow" # Jev classifies only ambiguous weak matches; revert: off.
jev_max_batch = 8
max_selected = 3
max_recovery = 0.10

[jev.skills]
cache_ttl_s = 86400
cache_max_entries = 500
# Origin owner/repo identities; repository provenance still has untrusted intake.
trusted_repos = []
# Exact hostnames accepted by static endpoint inspection.
allowed_domains = []

[harness]
# 2026-09-23: observe depth before promotion permits worker-visible skips.
depth_mode = "shadow" # off | shadow | active
