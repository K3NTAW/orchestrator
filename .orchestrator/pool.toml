# ponytail: TOML instead of YAML so stdlib tomllib parses it, no pyyaml dependency.
# window_cap_tokens is a calibration knob: set from observed 5h-window resets (§13).
window_cap_tokens = 10_000_000  # raised 2026-09-17 by user decision: 2M was hit in 2.2 h with zero real rate limits

[[claude_accounts]]
id = "A"
config_dir = "~/.claude-a"
role_affinity = ["planner", "scout", "triage", "execute", "review"]
reserve_for_planner = 0.35
daily_budget_tokens = 30_000_000  # 2026-09-18: was 6M, below the 10M 5h window; sized to ~3 windows/day

[[claude_accounts]]
id = "B"
config_dir = "~/.claude-b"
role_affinity = ["scout", "triage", "review", "challenge", "execute"]
reserve_for_planner = 0.0
daily_budget_tokens = 40_000_000  # 2026-09-18: was 8M; see window_cap_tokens note

[codex]
home = "~/.codex"
model = "gpt-6-astra"            # confirmed 2026-09-16, Codex CLI 0.154.0
max_parallel = 2
daily_budget_tasks = 40
on_exhausted = "fallback_claude" # hold | fallback_claude | overflow_api
dangerous_full_access = true     # --dangerously-bypass-approvals-and-sandbox; guardrails do not cover Codex, git + PR review do


# Executor pool: one row per routable model. pick_executor(role, complexity, scores) ranks the enabled rows.
# quota_group: a usage-limit hit on one member cools the whole group; limit scope per account vs per model
# is unconfirmed (2026-09-17).

[[executors]]
id = "astra"
provider = "codex"
model = "gpt-6-astra"
roles = ["execute"]
complexity_min = 1
complexity_max = 10
max_parallel = 2
daily_budget_tasks = 40
quota_group = "chatgpt"
weight = 1.0
enabled = true          # confirmed in models_cache.json 2026-09-17

[[executors]]
id = "luna"
provider = "codex"
model = "gpt-5.6-luna"
