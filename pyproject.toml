[project]
name = "orchestrator"
version = "0.1.0"
description = "Tri-model orchestrator: Planner (Claude Code) + Executor (Codex) + scouts, over a bus with hook-enforced gates"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2",
    "scrapling[fetchers]>=0.4.15",
]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]
