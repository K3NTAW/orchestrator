[project]
name = "orchestrator"
version = "0.1.0"
description = "Tri-model orchestrator: Planner (Claude Code) + Executor (Codex) + scouts, over a bus with hook-enforced gates"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2",
    "scrapling>=0.4.15",
    "curl_cffi>=0.16.1",
    "playwright>=1.62.0",
    "patchright>=1.62.1",
    "browserforge>=1.2.4",
]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]
